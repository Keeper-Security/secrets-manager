name: Release HV Plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'vault-plugin-secrets-ksm/v*'

jobs:
  release-hv-plugin:
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: integration/vault-plugin-secrets-ksm

    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Set up Go"
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Keep in step with the toolchain directive in go.mod. A stale pin here silently
          # resolves the build to the base patch release, which ships known stdlib CVEs.
          go-version: '1.25.12'
          cache: false

      # Cache GoLang libs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
          lookup-only: true

      - name: "Install External Dependencies"
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y osslsigncode

      - name: "Retrieve secrets from KSM"
        id: ksmsecrets
        uses: Keeper-Security/ksm-action@37abbada28637b6478ba845e73d3f8b9676572fe # v1.3.0
        with:
          keeper-secret-config: ${{ secrets.KSM_HASHICORP_VAULT_APP_CONFIG }}
          secrets: |
            9QY3bC2MXN-HaMMfpUHbGQ/file/keepersecurity.pfx > file:/tmp/keepersecurity.pfx
            9QY3bC2MXN-HaMMfpUHbGQ/custom_field/PFX Password > PASSPHRASE

      - name: "Fetch Go Dependencies"
        run: |
          go mod tidy

      - name: "Create binaries"
        run: | # initially `github.ref` == "ref/tags/vault-plugin-secrets-ksm/vX.Y.Z"
          PLUGIN_NAME="$(cut -d'/' -f3 <<<"${GITHUB_REF}")"
          PLUGIN_VERSION="$(cut -d'/' -f4 <<<"${GITHUB_REF}")"
          SIGNING_KEY="/tmp/keepersecurity.pfx"
          KEY_PASSPHRASE=${STEPS_KSMSECRETS_OUTPUTS_PASSPHRASE}
          echo "Plugin name: [${PLUGIN_NAME}]"
          echo "Plugin version: [${PLUGIN_VERSION:1}]"
          make release-all PLUGIN_NAME="${PLUGIN_NAME}" PLUGIN_VERSION="${PLUGIN_VERSION:1}" SIGNING_KEY="${SIGNING_KEY}" KEY_PASSPHRASE="${KEY_PASSPHRASE}"
        shell: bash
        env:
          STEPS_KSMSECRETS_OUTPUTS_PASSPHRASE: ${{ steps.ksmsecrets.outputs.PASSPHRASE }}

      - name: "Info: List created files"
        run: |
          pwd
          ls -la

      # Publish binaries
      - name: "Release Binaries"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${REF_NAME}" \
            --notes "KSM Hashicorp Vault Secrets Plugin ${REF_NAME}" \
            vault-plugin-secrets-ksm* || \
          gh release upload "${REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber \
            vault-plugin-secrets-ksm*
        shell: bash
