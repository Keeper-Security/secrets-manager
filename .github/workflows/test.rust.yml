name: Test Rust SDK

on:
  pull_request:
    branches: [ master, 'release/**' ]
    paths:
      - 'sdk/rust/**'
      - '.github/workflows/test.rust.yml'
  push:
    branches:
      - master
    paths:
      - 'sdk/rust/**'
      - '.github/workflows/test.rust.yml'

jobs:
  test-rust-sdk:
    name: Test Rust SDK (${{ matrix.rust }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        rust:
          - '1.87'
          - 'stable'

    defaults:
      run:
        working-directory: ./sdk/rust

    steps:
      - name: Get the source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          cache-workspaces: sdk/rust

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Run lib tests
        run: cargo test --all-features --lib

      - name: Run doc tests
        run: cargo test --all-features --doc

      - name: Run integration tests
        run: |
          cargo test --all-features --test folder_operations_tests
          cargo test --all-features --test file_operations_tests
          cargo test --all-features --test error_handling_tests
          cargo test --all-features --test regional_hostname_tests
          cargo test --all-features --test create_secret_test
          cargo test --all-features --test crypto_tests
          cargo test --all-features --test delete_secret_tests
          cargo test --all-features --test feature_validation_tests
          cargo test --all-features --test get_secrets_tests
          cargo test --all-features --test integration_tests
          cargo test --all-features --test notation_tests
          cargo test --all-features --test payload_test
          cargo test --all-features --test proxy_test
          cargo test --all-features --test totp_test
          cargo test --all-features --test update_secret_tests
          cargo test --all-features --test caching_transmission_key_tests
          cargo test --all-features --test download_file_by_title_tests
          cargo test --all-features --test duplicate_uid_notation_test
          cargo test --all-features --test empty_config_test
          cargo test --all-features --test bind_lifecycle_tests
          cargo test --all-features --test il5_tests
          cargo test --all-features --test keeper_record_link_tests
          cargo test --all-features --test str_ownership_tests
          cargo test --all-features --test throttle_tests

      - name: Run caching tests (serial execution required)
        run: cargo test --all-features --test caching_tests -- --test-threads=1

      - name: Build release
        run: cargo build --release

  resolve-without-lockfile:
    name: Resolve without Cargo.lock (Rust 1.87)
    # This job builds dependency releases that Cargo.lock does not pin.
    # Run it only for pull requests, and do not use the Actions cache.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./sdk/rust

    steps:
      - name: Get the source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@150fca883cd4034361b621bd4e6a9d34e5143606 # v1
        with:
          toolchain: '1.87'
          cache: false

      # Customers resolve their own dependency versions and ignore this crate's Cargo.lock.
      # The fallback resolver is the Rust 1.87 setup that the CHANGELOG recommends. This job does
      # not cover the default edition 2021 resolver, which can select releases that need a newer Rust.
      - name: Resolve dependencies without the lockfile and build
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          rm Cargo.lock
          cargo check --all-features
