name: Publish GCP Storage to NPM
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to NPM (uncheck to build only)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Extract version
        id: extract-version
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' sdk/javascript/packages/gcp/package.json | cut -d'"' -f4)
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  validate-version:
    name: Validate version not yet published
    needs: get-version
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check version not on npm
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          PACKAGE="@keeper-security%2Fsecrets-manager-gcp"
          CHECK_URL="https://registry.npmjs.org/${PACKAGE}/${VERSION}"
          echo "Checking npm for @keeper-security/secrets-manager-gcp $VERSION..."
          STATUS=$(curl -sS --retry 3 --retry-delay 2 -o /dev/null -w "%{http_code}" "$CHECK_URL")
          case "$STATUS" in
            404) echo "@keeper-security/secrets-manager-gcp $VERSION not yet on npm - ok to proceed" ;;
            200) echo "::error::@keeper-security/secrets-manager-gcp ${VERSION} is already on npm. Aborting."; exit 1 ;;
            *)   echo "::error::Unexpected status $STATUS from npm registry. Aborting."; exit 1 ;;
          esac

  generate-sbom:
    needs: validate-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get the source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: Install package dependencies
        run: npm ci --omit=dev
        working-directory: ./sdk/javascript/packages/gcp

      - name: Install Syft
        run: |
          echo "Installing Syft v1.32.0..."
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /tmp/bin v1.32.0
          echo "/tmp/bin" >> "$GITHUB_PATH"

      - name: Install Manifest CLI
        run: |
          echo "Installing Manifest CLI v0.31.0..."
          curl -sSfL https://raw.githubusercontent.com/manifest-cyber/cli/main/install.sh | sh -s -- -b /tmp/bin v0.31.0

      - name: Create Syft configuration
        run: |
          cat > syft-config.yaml << 'EOF'
          select-catalogers:
            - "-github-action-workflow-usage-cataloger"
            - "-github-actions-usage-cataloger"
          EOF

      - name: Generate and upload SBOM
        env:
          MANIFEST_API_KEY: ${{ secrets.MANIFEST_TOKEN }}
        run: |
          JAVASCRIPT_SDK_DIR="./sdk/javascript"

          # Get version from package.json
          echo "Detecting GCP Storage version..."
          if [ -f "${JAVASCRIPT_SDK_DIR}/packages/gcp/package.json" ]; then
            VERSION=$(grep -o '"version": "[^"]*"' "${JAVASCRIPT_SDK_DIR}/packages/gcp/package.json" | cut -d'"' -f4)
            echo "Detected version: ${VERSION}"
          else
            VERSION="1.0.0"
            echo "Could not detect version, using default: ${VERSION}"
          fi

          echo "Generating SBOM with Manifest CLI..."
          manifest sbom "${JAVASCRIPT_SDK_DIR}/packages/gcp" \
            --generator=syft \
            --name=keeper-secrets-manager-javascript-storage-gcp-kms \
            --version="${VERSION}" \
            --output=spdx-json \
            --file=gcp-storage-sbom.json \
            --api-key="${MANIFEST_API_KEY}" \
            --publish=true \
            --asset-label=application,sbom-generated,nodejs,gcp-storage \
            --generator-config=syft-config.yaml

          echo "SBOM generated and uploaded successfully: gcp-storage-sbom.json"
          echo "---------- SBOM Preview (first 20 lines) ----------"
          head -n 20 gcp-storage-sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom-keeper-secrets-manager-javascript-storage-gcp-kms-${{ github.run_number }}
          path: gcp-storage-sbom.json
          retention-days: 10

  build-npm:
    needs: generate-sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: ./sdk/javascript/packages/gcp

    steps:
      - name: Get the source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Upload NPM package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: npm-package-gcp-kms-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/sdk/javascript/packages/gcp/dist/
            ${{ github.workspace }}/sdk/javascript/packages/gcp/package.json

  publish-npm:
    needs: [build-npm, validate-version]
    if: ${{ github.event.inputs.publish == 'true' }}
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: ./sdk/javascript/packages/gcp

    steps:
      - name: Get the source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Publish package
        run: npm publish --ignore-scripts --provenance
