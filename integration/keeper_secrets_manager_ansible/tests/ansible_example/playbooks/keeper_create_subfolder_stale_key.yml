# vim: set shiftwidth=2 tabstop=2 softtabstop=-1 expandtab:
---
- name: Keeper Create Subfolder With Stale Key
  hosts: "my_systems"
  gather_facts: no

  tasks:
  - name: "Create Record Using The Old folder_uid Key"
    keeper_create:
      shared_folder_uid: "{{ shared_folder_uid }}"
      folder_uid: "{{ subfolder_uid }}"
      record_type: login
      generate_password: True
      title: "My Subfolder Record"
      fields:
        - type: login
          value: "johndoe@localhost"
    register: "new_record"
