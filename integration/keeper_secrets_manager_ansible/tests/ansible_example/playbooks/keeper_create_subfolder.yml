# vim: set shiftwidth=2 tabstop=2 softtabstop=-1 expandtab:
---
- name: Keeper Create In Subfolder
  hosts: "my_systems"
  gather_facts: no

  tasks:
  - name: "Create Record In Subfolder"
    keeper_create:
      shared_folder_uid: "{{ shared_folder_uid }}"
      subfolder_uid: "{{ subfolder_uid }}"
      record_type: login
      title: "My New Record"
      fields:
        - type: login
          value: "johndoe@localhost"
        - type: url
          value: "https://localhost"
    register: "new_record"

  - name: "Print Record UID"
    debug:
      var: new_record.record_uid
      verbosity: 0
