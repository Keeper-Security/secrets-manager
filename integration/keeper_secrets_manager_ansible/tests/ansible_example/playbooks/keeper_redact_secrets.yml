# vim: set shiftwidth=2 tabstop=2 softtabstop=-1 expandtab:
---
- name: Keeper Redact
  hosts: "my_systems"
  gather_facts: no

  tasks:
    - name: "Get a password with a quote and a backslash"
      keeper_get:
        uid: "{{ special_uid }}"
        field: "password"
      register: special

    - name: "Get a multiline key"
      keeper_get:
        uid: "{{ key_uid }}"
        field: "password"
      register: key

    - name: "Print the registered result of the first task"
      debug:
        var: special

    - name: "Fail with a message that holds a secret"
      fail:
        msg: "bad value {{ special.value }}"
      ignore_errors: true

    - name: "Print a JSON document that holds the secrets"
      debug:
        msg: "{{ [special.value, key.value] | to_json }}"

    - name: "Copy a secret to a directory that does not exist"
      ansible.builtin.copy:
        content: "{{ special.value }}"
        dest: /nonexistent-ksm-redact/digest
      ignore_errors: true
