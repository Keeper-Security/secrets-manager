---
version: 3
images:
  base_image:
    name: docker.io/redhat/ubi9:latest

dependencies:
  # The default python3 of UBI 9 is Python 3.9. Python 3.12 lets the image use newer ansible-core releases.
  python_interpreter:
    package_system: python3.12
    python_path: /usr/bin/python3.12
  # The 2.16 series still manages nodes that have Python 2.7 or 3.6.
  ansible_core:
    package_pip: ansible-core>=2.16.19,<2.17
  ansible_runner:
    package_pip: ansible-runner
  galaxy: requirements.yml
  python: requirements.txt

additional_build_steps:
  prepend_final:
    - RUN $PKGMGR install -y openssh-clients sshpass rsync git krb5-workstation && $PKGMGR clean all
